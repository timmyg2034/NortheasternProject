name: Keep Streamlit App Awake

on:
  schedule:
    # Run every 6 hours (00:00, 06:00, 12:00, 18:00 UTC)
    - cron: '0 */6 * * *'
  workflow_dispatch: # Allows manual one-click trigger from GitHub Actions tab

permissions:
  contents: read

jobs:
  keep-alive:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Playwright
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          playwright install --with-deps chromium

      - name: Ping and Wake Streamlit App
        env:
          STREAMLIT_APP_URL: ${{ vars.STREAMLIT_APP_URL || 'https://nuhuskies-hockey-bot.streamlit.app/' }}
        run: |
          python keep_alive.py --url "$STREAMLIT_APP_URL" --timeout 180

      - name: Upload Status Screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: streamlit-keep-alive-screenshot
          path: keep_alive_status.png
          if-no-files-found: ignore
          retention-days: 7
