services:
  - type: web
    name: nu-hockey-explorer
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt && npm --prefix frontend ci && npm --prefix frontend run build
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: CHAT_RATE_LIMIT_PER_MIN
        value: "6"
      - key: CHAT_RATE_LIMIT_PER_HOUR
        value: "40"
      - key: CHAT_RATE_LIMIT_PER_DAY
        value: "180"
      - key: MAX_DAILY_LLM_CALLS
        value: "1000"
      - key: TURNSTILE_SITE_KEY
        sync: false
      - key: TURNSTILE_SECRET_KEY
        sync: false
      - key: BUG_WEBHOOK_URL
        sync: false

